name: Local AI Config
version: 1.0.0
schema: v1

models:
  - name: DeepSeek Coder 16B
    provider: ollama
    model: deepseek-coder-v2:16b
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: Qwen 2.5 Coder 14B
    provider: ollama
    model: qwen2.5-coder:14b
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: Qwen 2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

# Model do automatycznego uzupełniania kodu podczas pisania (Tab)
tabAutocompleteModel:
  name: Qwen 7B Autocomplete
  provider: ollama
  model: qwen2.5-coder:7b

# Model do indeksowania i zrozumienia całego projektu (@Codebase)
embedder:
  name: Nomic Embed
  provider: ollama
  model: nomic-embed-text:latest